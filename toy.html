<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<style>
  html,body{margin:0;padding:0;background:#fff;
font-family:"Chalkboard SE","Noteworthy","Comic Sans MS",cursive;color:#111;}
  .wrap{padding:8px 4px 4px;}
  .hint{font-size:14px;margin:0 0 8px 4px;opacity:.85;}
  svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;}
  .bar-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px;}
  .bar-label{min-width:88px;}
  .bar-track{flex:1;height:14px;border:1.5px solid #111;background:#fff;position:relative;}
  .bar-fill{height:100%;transition:width .12s ease, background .12s ease;}
  .bar-pct{min-width:42px;text-align:right;}
  .a-note{font-size:12px;opacity:.7;}
</style></head><body>
<div class="wrap">
  <p class="hint">Потяни дом — распределение спроса между парками пересчитается</p>
  <svg id="stage" viewBox="0 0 560 260" role="img"
   aria-label="Перетащите дом: доли внимания между тремя местами пересчитываются">
<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5"
           patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="5" stroke="#111" stroke-width="1.3"/>
  </pattern>
</defs>
<g id="links"></g>
<g id="parks"></g>
<g id="house" cursor="grab">
  <circle cx="0" cy="0" r="22" fill="#fff" stroke="#111" stroke-width="2"/>
  <g transform="translate(-14,-16)" fill="none" stroke="#111" stroke-width="2"
     stroke-linejoin="round" stroke-linecap="round">
    <path d="M2 22 L14 10 L26 22"/>
    <path d="M6 20 V30 H22 V20"/>
    <rect x="11" y="22" width="6" height="8"/>
  </g>
  <text y="-38" text-anchor="middle" font-size="13">дом</text>
</g>
  </svg>
  <div id="bars" style="margin-top:10px;padding:0 4px;"></div>
</div>
<script>
(function(){
  const GAMMA = 2;
  const D_MIN = 18;
  const parks = [
{id:"A", x:110, y:70,  A:3, name:"сквер A"},
{id:"B", x:430, y:90,  A:9, name:"парк B"},
{id:"C", x:260, y:200, A:5, name:"парк C"}
  ];
  let house = {x:200, y:130};
  const svg = document.getElementById("stage");
  const houseG = document.getElementById("house");
  const linksG = document.getElementById("links");
  const parksG = document.getElementById("parks");
  const bars = document.getElementById("bars");

  function toSvg(evt){
const pt = svg.createSVGPoint();
pt.x = evt.clientX; pt.y = evt.clientY;
const ctm = svg.getScreenCTM().inverse();
return pt.matrixTransform(ctm);
  }

  function shares(){
const pulls = parks.map(p => {
  const d = Math.max(D_MIN, Math.hypot(house.x - p.x, house.y - p.y));
  const pull = p.A / Math.pow(d / 40, GAMMA);
  return Object.assign({}, p, {d, pull});
});
const sum = pulls.reduce((s, p) => s + p.pull, 0) || 1;
return pulls.map(p => Object.assign(p, {share: p.pull / sum}));
  }

  function barHatchColor(share){
// #1c32bd: чем выше доля, тем насыщеннее штриховка
const t = Math.min(1, Math.max(0, share));
const r = Math.round(219 + (28 - 219) * t);
const g = Math.round(224 + (50 - 224) * t);
const b = Math.round(248 + (189 - 248) * t);
return "rgb(" + r + "," + g + "," + b + ")";
  }

  function barFillStyle(share){
const c = barHatchColor(share);
return "repeating-linear-gradient(-45deg," + c + "," + c +
  " 2px,transparent 1px,transparent 5px)";
  }

  function render(){
const s = shares();
houseG.setAttribute("transform", "translate(" + house.x + "," + house.y + ")");
linksG.innerHTML = s.map(p =>
  '<line x1="'+house.x+'" y1="'+house.y+'" x2="'+p.x+'" y2="'+p.y+
  '" stroke="#111" stroke-width="1" stroke-linecap="round"/>'
).join("");
parksG.innerHTML = s.map(p => {
  const isC = p.id === "C";
  const nameY = isC ? 26 : -22;
  const aY = isC ? 42 : 34;
  return '<g transform="translate('+p.x+','+p.y+')">' +
  '<rect x="-14" y="-14" width="28" height="28" fill="url(#hatch)" stroke="#111" stroke-width="1.6"/>' +
  '<text y="'+nameY+'" text-anchor="middle" font-size="14">'+p.name+'</text>' +
  '<text y="'+aY+'" text-anchor="middle" font-size="12" opacity="0.7">A='+p.A+'</text>' +
  '</g>';
}).join("");
bars.innerHTML = s.map(p => {
  const pct = Math.round(p.share * 100);
  const fill = barFillStyle(p.share);
  return '<div class="bar-row"><div class="bar-label">'+p.name+
    ' <span class="a-note">A='+p.A+'</span></div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:'+pct+
    '%;background:'+fill+'"></div></div>' +
    '<div class="bar-pct">'+pct+'%</div></div>';
}).join("");
  }

  let dragging = false;
  houseG.addEventListener("pointerdown", e => {
e.preventDefault();
dragging = true;
houseG.setAttribute("cursor", "grabbing");
houseG.setPointerCapture(e.pointerId);
  });
  houseG.addEventListener("pointermove", e => {
if (!dragging) return;
const p = toSvg(e);
house.x = Math.min(540, Math.max(20, p.x));
house.y = Math.min(240, Math.max(20, p.y));
render();
  });
  function endDrag(e){
dragging = false;
houseG.setAttribute("cursor", "grab");
try { houseG.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  houseG.addEventListener("pointerup", endDrag);
  houseG.addEventListener("pointercancel", endDrag);
  render();
})();
</script>
</body></html>
