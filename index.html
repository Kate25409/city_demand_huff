      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

 class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style=\"max-width:640px;font-size:1.02rem;line-height:1.7;color:#3f3f46;font-family:Inter,system-ui,sans-serif;\"\u003E\u0421\u043d\u0430\u0447\u0430\u043b\u0430 \u0441\u043e\u0431\u0438\u0440\u0430\u0435\u043c \u003Cstrong\u003E\u043f\u0440\u0438\u0432\u043b\u0435\u043a\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c\u003C/strong\u003E \u043c\u0435\u0441\u0442\u0430 \u2014 \u043e\u0434\u043d\u043e \u0447\u0438\u0441\u043b\u043e \u0438\u0437 \u043f\u0440\u0438\u0437\u043d\u0430\u043a\u043e\u0432 \u0432\u0440\u043e\u0434\u0435 \u043f\u043b\u043e\u0449\u0430\u0434\u0438 \u043f\u0430\u0440\u043a\u0430, \u0434\u043e\u043b\u0438 \u0434\u0435\u0440\u0435\u0432\u044c\u0435\u0432 \u043e\u0442 \u0432\u0441\u0435\u0433\u043e \u043f\u0430\u0440\u043a\u0430, \u043d\u0430\u043b\u0438\u0447\u0438\u044f \u0432\u043e\u0434\u044b \u0438 \u0440\u0430\u0437\u043b\u0438\u0447\u043d\u044b\u0445 \u043e\u0431\u044a\u0435\u043a\u0442\u043e\u0432 \u0431\u043b\u0430\u0433\u043e\u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0430. \u0423 \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0434\u043e\u043c\u0430 \u0435\u0441\u0442\u044c \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u043e \u003Cstrong\u003E\u043a\u043e\u043d\u043a\u0443\u0440\u0438\u0440\u0443\u044e\u0449\u0438\u0445\u003C/strong\u003E \u0437\u0430 \u0435\u0433\u043e \u0441\u043f\u0440\u043e\u0441 \u043f\u0430\u0440\u043a\u043e\u0432 \u043f\u043e\u0431\u043b\u0438\u0437\u043e\u0441\u0442\u0438. \u0414\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0437\u0435\u043b\u0451\u043d\u043e\u0433\u043e \u043c\u0435\u0441\u0442\u0430 \u0441\u0432\u043e\u0439 \u0440\u0430\u0434\u0438\u0443\u0441 \u043e\u0446\u0435\u043d\u043a\u0438 \u0432 \u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e\u0441\u0442\u0438 \u043e\u0442 \u0435\u0433\u043e \u0440\u0430\u0437\u043c\u0435\u0440\u0430: \u043c\u0430\u043b\u0435\u043d\u044c\u043a\u0438\u0439 \u0441\u043a\u0432\u0435\u0440 (\u0026lt;1 \u0433\u0430) \u2014 \u0434\u043e \u003Cstrong\u003E1,5\u0026nbsp;\u043a\u043c\u003C/strong\u003E, \u0441\u0440\u0435\u0434\u043d\u0438\u0439 \u043f\u0430\u0440\u043a (1-10 \u0433\u0430) \u2014 \u0434\u043e \u003Cstrong\u003E3\u0026nbsp;\u043a\u043c\u003C/strong\u003E, \u043a\u0440\u0443\u043f\u043d\u044b\u0439 (\u0026gt;10 \u0433\u0430) \u2014 \u0434\u043e \u003Cstrong\u003E5\u0026nbsp;\u043a\u043c\u003C/strong\u003E. \u00ab\u041b\u044e\u0434\u0438\u00bb \u0432 \u043a\u0430\u0436\u0434\u043e\u043c \u0434\u043e\u043c\u0435 \u00ab\u0432\u0438\u0434\u044f\u0442\u00bb \u0442\u043e\u043b\u044c\u043a\u043e \u043c\u0435\u0441\u0442\u0430 \u0432\u043d\u0443\u0442\u0440\u0438 \u0442\u0430\u043a\u043e\u0433\u043e \u043a\u0440\u0443\u0433\u0430; \u0441\u043f\u0440\u043e\u0441 \u0431\u0443\u0434\u0435\u0442 \u0434\u0435\u043b\u0438\u0442\u044c\u0441\u044f \u043c\u0435\u0436\u0434\u0443 \u0442\u0430\u043a\u0438\u043c\u0438 \u043a\u043e\u043d\u043a\u0443\u0440\u0435\u043d\u0442\u0430\u043c\u0438.\u003C/div\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style=\"height:0.75rem;\"\u003E\u003C/div\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style=\"max-width:640px;font-size:1.02rem;line-height:1.7;color:#3f3f46;font-family:Inter,system-ui,sans-serif;\"\u003E\u0427\u0442\u043e\u0431\u044b \u0441\u043f\u0440\u043e\u0441 \u0438\u0437 \u0434\u043e\u043c\u0430 \u043d\u0435 \u0440\u0430\u0437\u043c\u0430\u0437\u044b\u0432\u0430\u043b\u0441\u044f \u043c\u0435\u0436\u0434\u0443 \u0431\u043e\u043b\u044c\u0448\u0438\u043c \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e\u043c \u043f\u0430\u0440\u043a\u043e\u0432, \u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0438\u0432\u0430\u0435\u043c\u0441\u044f \u003Cstrong\u003E10-\u044e\u003C/strong\u003E \u0431\u043b\u0438\u0436\u0430\u0439\u0448\u0438\u043c\u0438 (top-K) \u2014 \u0438\u043c\u0435\u043d\u043d\u043e \u043c\u0435\u0436\u0434\u0443 \u043d\u0438\u043c\u0438 \u0438 \u0434\u0435\u043b\u0438\u0442\u0441\u044f \u0432\u0435\u0441 \u0434\u043e\u043c\u0430. \u0415\u0441\u043b\u0438 \u0432 \u0440\u0430\u0434\u0438\u0443\u0441\u0435 \u043d\u0438\u043a\u043e\u0433\u043e \u043d\u0435\u0442, \u043f\u043e\u0434\u0441\u0442\u0430\u0432\u043b\u044f\u0435\u043c \u043e\u0434\u0438\u043d \u0431\u043b\u0438\u0436\u0430\u0439\u0448\u0438\u0439 \u043f\u0430\u0440\u043a, \u0447\u0442\u043e\u0431\u044b \u0442\u043e\u0447\u043a\u0430 \u043d\u0435 \u0432\u044b\u043f\u0430\u043b\u0430 \u0438\u0437 \u0440\u0430\u0441\u0447\u0451\u0442\u0430. \u0427\u0435\u043c \u0434\u0430\u043b\u044c\u0448\u0435 \u043c\u0435\u0441\u0442\u043e, \u0442\u0435\u043c \u0441\u043b\u0430\u0431\u0435\u0435 \u0435\u0433\u043e \u0441\u0438\u043b\u0430 \u043f\u0440\u0438\u0442\u044f\u0436\u0435\u043d\u0438\u044f.\u003C/div\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style=\"height:0.75rem;\"\u003E\u003C/div\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style=\"max-width:640px;font-size:1.02rem;line-height:1.7;color:#3f3f46;font-family:Inter,system-ui,sans-serif;\"\u003E\u0414\u043e\u043b\u044f \u0441\u043f\u0440\u043e\u0441\u0430, \u043a\u043e\u0442\u043e\u0440\u0430\u044f \u0443\u0445\u043e\u0434\u0438\u0442 \u043c\u0435\u0441\u0442\u0443, \u0440\u0430\u0432\u043d\u0430 \u0441\u0438\u043b\u0435 \u043f\u0440\u0438\u0442\u044f\u0436\u0435\u043d\u0438\u044f \u043c\u0435\u0441\u0442\u0430, \u0434\u0435\u043b\u0451\u043d\u043d\u043e\u0439 \u043d\u0430 \u0441\u0443\u043c\u043c\u0443 \u0441\u0438\u043b \u043f\u0440\u0438\u0442\u044f\u0436\u0435\u043d\u0438\u044f \u0432\u0441\u0435\u0445 \u043a\u043e\u043d\u043a\u0443\u0440\u0435\u043d\u0442\u043e\u0432 \u0443 \u044d\u0442\u043e\u0433\u043e \u0434\u043e\u043c\u0430. \u0422\u043e \u0436\u0435 \u0441\u0430\u043c\u043e\u0435 \u043e\u0434\u043d\u043e\u0439 \u0
